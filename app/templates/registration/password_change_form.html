{% extends "base.html" %}

{% block title %}
  Поменять пароль
{% endblock %}

{% block content %}
  <div class="col d-flex justify-content-center">
    <div class="card col-4 m-3">
      <div class="card-header">
        Поменять пароль
      </div>

      <div class="card-body">
        <form method="post" action="/auth/password_change/">
          {{ csrf_input(request) }}
          <div class="mb-3">
            <label class="form-label" for="old_password">Старый пароль</label>
            <input class="form-control" id="old_password" type="password" name="old_password" required>
          </div>

          <div class="mb-3">
            <label class="form-label" for="new_password1">Новый пароль</label>
            <input class="form-control" id="new_password1" type="password" name="new_password1" required>
          </div>

          <div class="mb-3">
            <label class="form-label" for="new_password2">Подтверждение нового пароля</label>
            <input class="form-control" id="new_password2" type="password" name="new_password2" required>
          </div>

          <button class="btn btn-primary" type="submit">Поменять пароль</button>
        </form>
      </div>
    </div>
  </div>
{% endblock %}
