<header>
  <nav class="navbar navbar-light" style="background-color: lightskyblue">
    <div class="container">
      <a class="navbar-brand" href="/">
        <img src="/static/img/logo.png" width="30" height="30" class="d-inline-block align-top" alt="">
        Блогикум
      </a>

      <ul class="nav nav-pills">
        <li class="nav-item">
          <a class="nav-link {% if request.url.path == '/about/' %}text-white{% endif %}" href="/about/">
            О проекте
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link {% if request.url.path == '/rules/' %}text-white{% endif %}" href="/rules/">
            Правила
          </a>
        </li>

        {% if user %}
          <div class="btn-group" role="group" aria-label="Basic outlined example">
            <button type="button" class="btn btn-outline-primary">
              <a class="text-decoration-none text-reset" href="/posts/create/">Написать пост</a>
            </button>

            <button type="button" class="btn btn-outline-primary">
              <a class="text-decoration-none text-reset" href="/profile/{{ user.username }}/">{{ user.username }}</a>
            </button>

            {% if user.is_staff or user.is_superuser %}
              <button type="button" class="btn btn-outline-primary">
                <a class="text-decoration-none text-reset" href="/admin/">Админка</a>
              </button>
            {% endif %}

            <button type="button" class="btn btn-outline-primary">
              <a class="text-decoration-none text-reset" href="/auth/logout/">Выйти</a>
            </button>
          </div>
        {% else %}
          <div class="btn-group" role="group" aria-label="Basic outlined example">
            <button type="button" class="btn btn-outline-primary">
              <a class="text-decoration-none text-reset" href="/auth/login/">Войти</a>
            </button>

            <button type="button" class="btn btn-outline-primary">
              <a class="text-decoration-none text-reset" href="/auth/registration/">Регистрация</a>
            </button>
          </div>
        {% endif %}
      </ul>
    </div>
  </nav>
</header>
