[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blogicum-fastapi"
version = "0.8.0"
description = "FastAPI Blogicum project with refresh tokens, media attachments, uv and dishka"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "SQLAlchemy>=2.0",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "psycopg[binary]>=3.1",
  "alembic>=1.13",
  "PyJWT>=2.8",
  "python-multipart>=0.0.9",
  "jinja2>=3.1",
  "sqladmin>=0.20",
  "itsdangerous>=2.2",
  "dishka>=1.6",
]

[dependency-groups]
dev = [
  "httpx>=0.27",
  "pytest>=8.0",
  "ruff>=0.4",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.uv]
package = false

[tool.uvicorn]
factory = false
